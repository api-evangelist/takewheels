name: TakeWheels
description: >-
  TakeWheels (branded "Wheels", operated by Wheels Labs) was a shared electric
  micromobility platform based in Los Angeles, founded in 2018, that offered
  seated pedal-assist e-bikes and dockless light electric vehicles for
  short-distance urban trips. It was surfaced in the API Evangelist network as a
  portfolio company of Bullpen Capital, which participated in the company's 2019
  Series A. Enrichment found no public API, developer portal, documentation,
  SDKs, or any machine-readable developer surface for this company. As of this
  pass the primary domain (takewheels.com) no longer resolves to the company:
  it issues a 301 redirect to an unrelated third-party site, indicating the
  business is defunct and the domain has been repurposed. This profile is
  retained as a historical portfolio lead with no active API surface.
